name: agents-platform

x-app: &app
  image: agents-platform-app:local
  build: .
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://${DATABASE_APP_USER:-agents_app}:${DATABASE_APP_PASSWORD:-local-app-only}@postgres:5432/agents
    TEMPORAL_ADDRESS: temporal:7233
    TEMPORAL_NAMESPACE: default
    TEMPORAL_UI_URL: ${TEMPORAL_UI_URL:-http://localhost:8233}
    TEMPORAL_TASK_QUEUE: agents-platform
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    OTEL_ENABLED: ${OTEL_ENABLED:-false}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_DOCKER_ENDPOINT:-http://host.docker.internal:4318}
    OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-local}
    SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
    JAEGER_UI_URL: http://localhost:16686
    LANGFUSE_BASE_URL: ${LANGFUSE_DOCKER_URL:-http://host.docker.internal:3000}
    LANGFUSE_UI_URL: http://localhost:3000
    LANGFUSE_PROJECT_ID: hellocounsel-agents
    LANGFUSE_CONTENT_MODE: ${LANGFUSE_CONTENT_MODE:-redacted}
    LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
    LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    OPS_POLL_SECONDS: ${OPS_POLL_SECONDS:-15}
    OPS_OUTBOX_AGE_SECONDS: ${OPS_OUTBOX_AGE_SECONDS:-60}
    OPS_WORKER_DELAY_SECONDS: ${OPS_WORKER_DELAY_SECONDS:-120}
    OPS_CALLBACK_GRACE_SECONDS: ${OPS_CALLBACK_GRACE_SECONDS:-60}
    OPS_REVIEW_AGE_SECONDS: ${OPS_REVIEW_AGE_SECONDS:-86400}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    OPERATOR_API_KEY: ${OPERATOR_API_KEY:-local-development-only}
    AGENT_MODE: ${AGENT_MODE:-scripted}
    CONTEXT_INPUT_TOKENS: ${CONTEXT_INPUT_TOKENS:-12000}
    CONTEXT_OUTPUT_TOKENS: ${CONTEXT_OUTPUT_TOKENS:-1500}
    CONTEXT_RETRIEVAL_CALLS: ${CONTEXT_RETRIEVAL_CALLS:-4}
    DEMO_ASSUME_ROUTINE_UPDATES: ${DEMO_ASSUME_ROUTINE_UPDATES:-false}
    DEMO_FOLLOW_UP_SECONDS: ${DEMO_FOLLOW_UP_SECONDS:-30}
    DEMO_MAX_ACTIVATIONS: ${DEMO_MAX_ACTIVATIONS:-6}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agents
      POSTGRES_PASSWORD: agents
      POSTGRES_DB: agents
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agents -d agents"]
      interval: 3s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/temporal:1.10.0
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /home/temporal/temporal.db
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      - temporal-data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "namespace", "describe", "--namespace", "default", "--address", "localhost:7233"]
      interval: 3s
      timeout: 5s
      retries: 30

  migrate:
    <<: *app
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+psycopg://agents:agents@postgres:5432/agents
      DATABASE_APP_USER: ${DATABASE_APP_USER:-agents_app}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:-local-app-only}
    command: ["sh", "-c", "alembic upgrade head && python -m agents_platform.audit_roles"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=8)"]
      interval: 10s
      timeout: 10s
      retries: 5

  worker:
    <<: *app
    command: ["python", "-m", "agents_platform.orchestration.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy

volumes:
  postgres-data:
  temporal-data:
